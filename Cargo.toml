# Cargo.toml — Workspace root for the kestrel Rust code.
#
# Two members:
#   - crates/engine : kestrel-engine, the protocol-agnostic transfer/session
#                     core. It has NO dependency on Tauri and is tested headless
#                     (`cargo test -p kestrel-engine`).
#   - src-tauri     : the thin Tauri shell (commands, DTOs, event bridge) that
#                     depends on the engine.
#
# [workspace.dependencies] centralizes version pins so both members agree. A
# version listed here is only fetched/compiled when a member opts in via
# `{ workspace = true }`, so declaring the full set up front is free until used.
# russh / russh-sftp are exact-pinned because 0.x releases carry breaking API
# churn (see tasks.md Appendix C risk register).

[workspace]
members = ["src-tauri", "crates/engine"]
resolver = "2"

[workspace.dependencies]
# Async runtime and utilities
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors, logging, misc
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"

# SSH / SFTP (exact-pinned — see note above)
russh = "=0.62.2"
russh-sftp = "=2.3.0"

# Crypto primitives for host-key fingerprints and hashed known_hosts matching
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"

# Archive streaming for tar-accelerated directory transfers (E8-S2).
tar = "0.4"

# Credentials and filesystem watching
keyring = "4"
notify = "8"

# Test-only helpers
tempfile = "3"
rand = "0.9"
