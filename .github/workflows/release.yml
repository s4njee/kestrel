# release.yml — Build installable desktop artifacts on a version tag.
#
# A v* tag produces exactly the two primary download formats: a universal
# macOS .app wrapped in a .zip, and a Windows x64 NSIS installer (.exe). The
# final job collects both builds into one published GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS universal ZIP
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS application
        run: >-
          pnpm tauri build --ci
          --target universal-apple-darwin
          --bundles app
          --config .github/tauri.release.conf.json

      - name: Package macOS ZIP
        shell: bash
        run: |
          app_path="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Tauri did not produce a macOS .app bundle" >&2
            exit 1
          fi
          zip_path="$RUNNER_TEMP/kestrel-${GITHUB_REF_NAME}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"
          test -s "$zip_path"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-zip
          path: ${{ runner.temp }}/kestrel-${{ github.ref_name }}-macos-universal.zip
          if-no-files-found: error

  windows:
    name: Windows x64 EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows NSIS installer
        run: >-
          pnpm tauri build --ci
          --bundles nsis
          --config .github/tauri.release.conf.json

      - name: Normalize Windows EXE name
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path target -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not produce a Windows NSIS installer"
          }
          $output = Join-Path $env:RUNNER_TEMP "kestrel-$env:GITHUB_REF_NAME-windows-x64.exe"
          Copy-Item $installer.FullName $output
          if ((Get-Item $output).Length -eq 0) {
            throw "Windows installer is empty"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: ${{ runner.temp }}/kestrel-${{ github.ref_name }}-windows-x64.exe
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release contents
        shell: bash
        run: |
          test -s "release-assets/kestrel-${GITHUB_REF_NAME}-macos-universal.zip"
          test -s "release-assets/kestrel-${GITHUB_REF_NAME}-windows-x64.exe"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Kestrel $GITHUB_REF_NAME"
          fi
