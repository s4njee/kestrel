# e2e.yml — Non-blocking Linux end-to-end smoke test.
#
# Builds the release app and drives it through tauri-driver + WebdriverIO against
# an atmoz/sftp container: launch → connect → download one file → assert the
# transfer row completes. Linux only (tauri-driver has no macOS support). The job
# is best-effort (continue-on-error) so webview/driver flakiness never blocks a
# merge; treat failures as a signal to investigate, not a hard gate.

name: E2E smoke (Linux)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e smoke (ubuntu-22.04)
    runs-on: ubuntu-22.04
    continue-on-error: true

    services:
      sftp:
        image: atmoz/sftp:alpine
        env:
          SFTP_USERS: "user:pass:::upload"
        ports:
          - 2222:22

    env:
      E2E_HOST: 127.0.0.1
      E2E_PORT: 2222
      E2E_USER: user
      E2E_PASS: pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            webkit2gtk-driver \
            xvfb

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the release app
        run: pnpm tauri build --no-bundle

      - name: Seed a file to download
        run: |
          # atmoz/sftp exposes the user's /upload; drop a file to fetch.
          echo "hello from ci" > /tmp/seed.txt
          # The container mounts a fresh volume; use sftp to place the file.
          sudo apt-get install -y openssh-client sshpass
          sshpass -p pass sftp -oStrictHostKeyChecking=no -P 2222 user@127.0.0.1 <<'SFTP'
          put /tmp/seed.txt /upload/seed.txt
          SFTP

      - name: Run e2e smoke under Xvfb
        run: xvfb-run --auto-servernum pnpm test:e2e
