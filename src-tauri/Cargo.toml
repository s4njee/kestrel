[package]
name = "sftpapp"
version = "0.1.0"
description = "Cross-platform SFTP file-transfer client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sftpapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# OS keychain for saved passwords/passphrases. keyring 4's default `v1` feature
# selects the platform-appropriate backend per target — macOS Keychain, Windows
# Credential Manager, Linux Secret Service (GNOME Keyring / KWallet) — and keeps
# the classic `Entry` API, so no per-target feature juggling is needed.
keyring = { workspace = true }

# The protocol-agnostic engine: sessions, transfers, RemoteFs. All disk/network
# I/O lives here; the shell only marshals paths/metadata across IPC.
sftpapp-engine = { path = "../crates/engine" }

[dev-dependencies]
tempfile = { workspace = true }

